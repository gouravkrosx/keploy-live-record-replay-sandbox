apiVersion: batch/v1
kind: Job
metadata:
  name: seeder
  namespace: live
spec:
  ttlSecondsAfterFinished: 300  # Auto-cleanup after 5 minutes
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: seeder
    spec:
      restartPolicy: Never
      initContainers:
        # Wait for MySQL to be ready before running seeder
        - name: wait-for-mysql
          image: busybox:1.36
          imagePullPolicy: Never  # Use local image from Kind
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL to be ready..."
              until nc -z mysql 3306; do
                echo "MySQL is not ready yet, waiting..."
                sleep 5
              done
              echo "MySQL is ready!"
              # Give MySQL a bit more time to fully initialize
              sleep 10
      containers:
        - name: seeder
          image: marketplace-seeder:latest
          imagePullPolicy: Never  # Use local image from Kind
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: marketplace
            - name: DB_PASSWORD
              value: marketplace123
            - name: DB_NAME
              value: marketplace_db
            - name: JWT_SECRET
              value: your-super-secret-jwt-key-change-in-production
